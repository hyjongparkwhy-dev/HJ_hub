name: collect

on:
  schedule:
    - cron: "0 21 * * *" # 06:00 KST
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # A normal run is a few minutes including the model download; this caps a stuck run.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: collector
    env:
      FASTEMBED_CACHE: ${{ github.workspace }}/.cache/fastembed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The ~220MB embedding model is downloaded once and reused instead of fetched from Hugging Face daily.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/fastembed
          key: fastembed-paraphrase-multilingual-MiniLM-L12-v2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r requirements.txt
      # Prints counts only: this repository and its logs are public.
      - run: python -m hub_collect
        env:
          HUB_DATABASE_URL: ${{ secrets.HUB_DATABASE_URL }}
